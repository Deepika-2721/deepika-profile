name: PR Quality Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML title
        run: |
          for file in *.html; do
            if ! grep -qi "<title>" "$file"; then
              echo "ERROR: $file is missing a title tag"
              exit 1
            fi
          done
          echo "HTML title check passed"

  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check images have alt attributes
        run: |
          if grep -Ein '<img[^>]*(?<![[:alnum:]_-])alt[[:space:]]*=' index.html >/dev/null; then
            echo "Image alt attributes found"
          fi
          python3 - <<'PY'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          images = re.findall(r"<img\b[^>]*>", html, flags=re.I)
          missing = [tag for tag in images if not re.search(r"\balt\s*=", tag, flags=re.I)]
          if missing:
              print("Images missing alt attributes:", *missing, sep="\n")
              sys.exit(1)
          print("All images have alt attributes")
          PY

  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript for console.log
        run: |
          if grep -n "console.log" js/*.js; then
            echo "ERROR: Remove console.log before merging"
            exit 1
          fi
          echo "No console.log statements found"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [check-html-titles, check-image-alt, check-no-console-log]
    steps:
      - name: All checks passed
        run: echo "All PR checks passed! Ready for review."
